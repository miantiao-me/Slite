packages:
  - docs

strictPeerDependencies: true
overrides:
  source-map-resolve@0.6.0>decode-uri-component: 0.2.2
  vue-metamorph@3.3.4>glob: 11.1.0
  vitepress@1.6.4>vite: 5.4.21
  # Slite stores links with node:sqlite through drizzle-orm/node-sqlite, so the
  # optional better-sqlite3 peer of db0 and drizzle-orm must not be installed.
  db0>better-sqlite3: '-'
  drizzle-orm>better-sqlite3: '-'
  drizzle-orm>@types/better-sqlite3: '-'
allowBuilds:
  workerd: false
  '@parcel/watcher': true
  esbuild: true
  maplibre-gl: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@nuxtjs/i18n@10.4.1'
  - eslint@10.7.0
  - virtua@0.49.3
